<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317627e'/%3E%3Cpath d='M6 24h7v-7h7v-7h6' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<meta name="description" content="음을 한 옥타브씩 옮기며 근음, 밑음, 자리바꿈을 배우는 음악이론 게임">
<title>화음 에스컬레이터</title>
<style>
/*{{STYLE}}*/
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <button id="homeBtn" type="button" aria-label="운행일 지도로" class="homeBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10 12 3l8 7v11h-6v-7h-4v7H4z"/></svg></button><b id="dayName"></b>
    <span id="dots" role="img" aria-label="진행"></span>
    <button id="soundChip" type="button" hidden>소리 켜기</button>
  </header>
  <section id="card" aria-label="운행 카드">
    <span id="askTag"></span>
    <p id="askText"></p>
    <div id="plate"><b id="plateName"></b><small id="plateSub"></small></div><button id="labOptionsBtn" type="button" hidden>화음 설정</button>
  </section>
  <section id="stage" aria-label="무대">
    <svg id="bg" aria-hidden="true" focusable="false"><g id="bgStatic"></g><g id="bgDyn"></g></svg>
    <div id="lamp" aria-hidden="true"></div>
    <div id="tokens"></div>
  </section>
  <p id="readout" role="status" aria-live="polite"></p>
  <section id="controls" aria-label="조작">
    <div id="rowA">
      <button id="btnA" type="button" class="seg" hidden>A</button>
      <button id="btnB" type="button" class="seg" hidden>B</button>
      <button id="btnDown" type="button" class="ride" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h12L8 13z"/></svg><span>내리기</span></button>
      <button id="btnReset" type="button" class="mini" hidden>처음</button>
      <div id="chips" hidden></div>
      <button id="btnUp" type="button" class="ride" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 11h12L8 3z"/></svg><span>올리기</span></button>
      <button id="padBass" type="button" class="pad" hidden>밑음 치기</button>
      <button id="padUpper" type="button" class="pad" hidden>윗음 치기</button>
    </div>
    <div id="rowB">
      <button id="btnHear" type="button">듣기</button>
      <button id="btnOk" type="button" class="main">확정</button>
    </div>
  </section>
  <section id="screenPanel" hidden aria-label="메뉴"></section>
  <section id="labPanel" hidden aria-label="자유 실험실 설정"></section>
  <div id="soundCheck" hidden role="dialog" aria-modal="true" aria-label="소리 확인"><div><h2>소리가 들리나요?</h2><p>가장 낮은 C 음을 들려드려요.</p><button type="button" data-sound-check="yes">들려요</button><button type="button" data-sound-check="no">안 들려요</button></div></div>
  <div id="tutorial" hidden role="status"></div>
  <div id="rotateNotice" hidden>세로로 돌려 주세요</div>

</div>
<script>
/*{{SCRIPT}}*/
</script>
</body>
</html>
