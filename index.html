<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317627e'/%3E%3Cpath d='M6 24h7v-7h7v-7h6' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<meta name="description" content="음을 한 옥타브씩 옮기며 근음, 밑음, 자리바꿈을 배우는 음악이론 게임">
<title>화음 에스컬레이터</title>
<style>
:root {
  --bg: #e9eef2; --panel: #ffffff; --line: #c7d2da; --ink: #1a2630; --ink-2: #4b5b68;
  --steel: #17627e; --steel-soft: #dcedf4; --good: #256f43; --warn: #8f5000; --bad: #ab3626;
  --r0: #ffd35c; --r0-edge: #8a5a00; --r1: #bfe3f2; --r1-edge: #17627e; --r2: #cdeccf; --r2-edge: #256f43; --r3: #e3d3f4; --r3-edge: #6a3fa0;
  --plainTok: #eef1f4; --lamp: #fff3c4; --cardH: 56px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: var(--bg); color: var(--ink);
  overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; word-break: keep-all; overflow: hidden; }
button { font: inherit; color: inherit; margin: 0; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
button:focus-visible { outline: 3px solid #0b4f8a; outline-offset: 2px; }
[hidden] { display: none !important; }

/* 틀: 다섯 줄. 무대만 늘어난다 */
#app { position: relative; height: 100vh; height: 100dvh; max-width: 720px; margin: 0 auto; display: grid; grid-template-rows: 44px var(--cardH) minmax(0, 380px) 40px 104px; align-content: space-between; gap: 6px;
  padding: calc(6px + env(safe-area-inset-top, 0px)) calc(8px + env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) calc(8px + env(safe-area-inset-left, 0px)); }
#app.narrow { --cardH: 50px; }

/* HUD */
#hud { display: flex; align-items: center; gap: 8px; min-width: 0; }
#dayName { flex: 1 1 auto; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dots { flex: 0 0 auto; display: flex; gap: 4px; align-items: center; }
#dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink-2); background: transparent; }
#dots i.full { background: var(--ink); border-color: var(--ink); }
#dots i.half { background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); border-color: var(--ink); }
#dots i.now { border-color: var(--steel); box-shadow: 0 0 0 2px var(--steel-soft); }
#soundChip { flex: 0 0 auto; height: 44px; padding: 0 12px; border-radius: 22px; border: 2px solid var(--warn); background: #fff7e8; color: var(--warn); font-size: 13px; font-weight: 700; }
#hud.nosound #dayName { display: none; }
#hud.nosound #dots { flex: 1 1 auto; }

/* 운행 카드 */
#card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0 8px 0 10px; min-width: 0; }
#askTag { font-size: 12px; font-weight: 700; color: var(--steel); background: var(--steel-soft); border-radius: 8px; padding: 4px 6px; white-space: nowrap; }
#askText { margin: 0; font-size: 15px; line-height: 1.3; font-weight: 600; max-height: 2.6em; overflow: hidden; }
#app.narrow #askText { font-size: 14px; }
#plate { min-width: 58px; max-width: 96px; height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; background: #fbfcfd; }
#plate.none { visibility: hidden; }
#plate.is-bad { border-color: var(--bad); border-style: dashed; color: var(--bad); }
#plateName { font-size: 16px; line-height: 1.1; white-space: nowrap; }
#plateSub { font-size: 12px; line-height: 1.1; color: var(--ink-2); white-space: nowrap; }
#plate.is-bad #plateSub { color: var(--bad); }

/* 무대: 오선(층) 위에 음이 높이대로 선다 */
#stage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-height: 0; }
#bg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.staffline { stroke: #7d8c98; stroke-width: 1.4; }
.ledger { stroke: #7d8c98; stroke-width: 1.4; }
.divider { stroke: var(--line); stroke-width: 1.2; }
.clef { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
.clefdot { fill: var(--ink); }
.head { stroke: var(--ink); stroke-width: 1.6; }
.beam { fill: var(--lamp); }
.esc .band { stroke: #17627e; stroke-opacity: .1; stroke-width: 12; stroke-linecap: round; }
.esc .rail { stroke: #17627e; stroke-opacity: .55; stroke-width: 1.6; stroke-dasharray: 5 4; }
.esc .tip { fill: #17627e; fill-opacity: .6; }
.esc.down .band { stroke: #8f5000; stroke-opacity: .08; }
.esc.down .rail { stroke: #8f5000; stroke-opacity: .5; }
.esc.down .tip { fill: #8f5000; fill-opacity: .55; }
.gap text { font-size: 12px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
.gap rect { fill: #fff; stroke: var(--ink-2); stroke-width: 1; }
.wkey { fill: #fff; stroke: #8b99a5; stroke-width: 1; }
.bkey { fill: #26323c; }
.keymark { font-size: 12px; font-weight: 800; fill: var(--ink); text-anchor: middle; }
#tokens { position: absolute; inset: 0; }
.tok { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; border: 2.5px solid var(--ink-2); border-radius: 50%; background: var(--plainTok);
  transition: transform .42s cubic-bezier(.3, .7, .3, 1), box-shadow .15s; will-change: transform; }
.tok b { font-size: 17px; line-height: 1; }
.tok small { font-size: 12px; line-height: 1; font-weight: 700; }
.tok.r0 { background: var(--r0); border-color: var(--r0-edge); border-radius: 9px; }
.tok.r1 { background: var(--r1); border-color: var(--r1-edge); }
.tok.r2 { background: var(--r2); border-color: var(--r2-edge); }
.tok.r3 { background: var(--r3); border-color: var(--r3-edge); }
.tok.is-sel { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--steel); z-index: 2; }
.tok.is-off { opacity: .5; text-decoration: line-through; }
.tok.is-on { box-shadow: 0 0 0 3px #fff, 0 0 0 7px #e0a100; z-index: 3; }
.tok:disabled { cursor: default; }
#lamp { position: absolute; left: 0; top: 0; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; border-radius: 9px; border: 1.5px solid var(--ink-2); background: #f3f5f7; color: var(--ink-2); white-space: nowrap; padding: 0 6px; transition: transform .3s; }
#lamp.is-lit { background: var(--ink); color: #fff; border-color: var(--ink); }

/* 판독 줄 */
#readout { margin: 0; padding: 0 4px; font-size: 13.5px; line-height: 1.35; display: flex; align-items: center; overflow: hidden; }
#readout.good { color: var(--good); font-weight: 600; }
#readout.warn { color: var(--warn); font-weight: 600; }
#readout.bad { color: var(--bad); font-weight: 600; }

/* 조작부: 높이 104px 고정. 묶음은 미리 두고 숨긴다 */
#controls { display: grid; grid-template-rows: 48px 52px; gap: 4px; min-width: 0; }
#rowA, #rowB { display: flex; gap: 4px; min-width: 0; }
#chips { flex: 1 1 auto; display: flex; gap: 4px; min-width: 0; }
#controls button { border: 2px solid var(--ink-2); border-radius: 12px; background: var(--panel); font-size: 14px; font-weight: 700; min-width: 44px; padding: 0 4px; display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
#controls button svg { width: 14px; height: 14px; fill: currentColor; flex: 0 0 auto; }
.chip, .ride, .pad { flex: 1 1 0; }
.seg { flex: 0 0 48px; }
.mini { flex: 0 0 52px; }
#btnHear { flex: 0 0 92px; }
#controls button.main, #close button.main { flex: 1 1 auto; background: var(--steel); border-color: var(--steel); color: #fff; font-size: 16px; }
#controls button.is-sel { background: var(--steel-soft); border-color: var(--steel); box-shadow: inset 0 0 0 2px var(--steel); }
#controls button.is-off { opacity: .45; text-decoration: line-through; }
#controls button:disabled { cursor: default; }
#controls button.ride:disabled { opacity: .45; }

/* 마감 */
#close { position: absolute; left: 8px; right: 8px; top: 56px; bottom: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
#close h1 { margin: 0; font-size: 18px; }
#close p { margin: 0; font-size: 14px; line-height: 1.4; }
#closeList { margin: 0; padding: 0 0 0 22px; font-size: 14px; line-height: 1.7; flex: 1 1 auto; }
#closeTest { color: var(--ink-2); font-size: 12px !important; }
#close button.main { flex: 0 0 52px; border: 2px solid var(--steel); border-radius: 12px; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .tok, #lamp { transition: none; } }

/* The five-row geometry stays shared by every run. */
#homeBtn { width:44px; height:44px; flex:0 0 44px; display:grid; place-items:center; border:0; border-radius:14px; background:var(--panel); color:var(--steel); }
#homeBtn svg { width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
#hud { gap:6px; }
#card { box-shadow:0 2px 0 #dce4e9; }
#stage { border-color:#b7c7d1; box-shadow:inset 0 1px 0 #fff,0 2px 0 #dce4e9; }
#plate { background:linear-gradient(160deg,#fff,#edf3f6); border-width:1.5px; box-shadow:0 2px 0 #c7d2da; }
#plate.is-bad { background:#fff5f1; }
#askTag { background:transparent; padding:4px 0; }
.tok { box-shadow:0 3px 0 #bcc8d0; border-width:2px; transition:transform .42s cubic-bezier(.3,.7,.3,1),opacity .15s; }
.tok.r0 { box-shadow:0 3px 0 #c99e36,inset 0 2px 0 #fff0bd; border-radius:8px; }
.tok.r1 { box-shadow:0 3px 0 #87b9cd,inset 0 2px 0 #e2f5fc; }
.tok.r2 { box-shadow:0 3px 0 #9dc6a1,inset 0 2px 0 #e8f7e9; }
.tok.r3 { box-shadow:0 3px 0 #bea5d6,inset 0 2px 0 #f0e5fa; }
.tok.is-sel { box-shadow:0 0 0 3px #fff,0 0 0 6px var(--steel); }
.tok.is-on { box-shadow:0 0 0 3px #fff,0 0 0 7px #b88700; }
.tok.is-off { opacity:.65; }
.tok b { display:inline-flex; align-items:center; justify-content:center; }
.esc .steps { fill:none; stroke:#17627e; stroke-opacity:.55; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
.esc.down .steps { stroke:#8f5000; }
.esc .rail { stroke-dasharray:none; stroke-width:1.6; }
.esc .band { stroke-width:15; }
.staffline { stroke:#8495a2; }
#lamp.is-lit { box-shadow:0 0 0 3px var(--lamp); }
#controls button { box-shadow:0 2px 0 #c7d2da; border-width:1.5px; border-radius:10px; }
#controls button:active { box-shadow:inset 0 2px 2px #d0dce3; }
#controls button.main { box-shadow:0 3px 0 #0d455b; }
#controls button.is-sel { box-shadow:inset 0 0 0 2px var(--steel); }
#readout { border-radius:8px; }
#readout.bad { background:#fff4ee; }
#readout.warn { background:#fff7e8; }
.accidental { display:inline-block; width:.58em; height:1.13em; vertical-align:-.14em; fill:currentColor; stroke:currentColor; stroke-width:1.35; stroke-linecap:round; stroke-linejoin:round; overflow:visible; }
.accidental.double-flat { width:.9em; }
.accidental path { vector-effect:non-scaling-stroke; }
#plateName .accidental { width:.55em; }
#readout .accidental { stroke-width:1.1; }
#rotateNotice { display:none; position:fixed; inset:0; z-index:90; background:var(--bg); align-items:center; justify-content:center; flex-direction:column; gap:18px; padding:24px; text-align:center; }
#rotateNotice svg { width:70px; height:70px; fill:none; stroke:var(--steel); stroke-width:2; }
[data-motion="reduced"] *,[data-motion="reduced"] *::before,[data-motion="reduced"] *::after { transition-duration:0s!important; animation-duration:0s!important; animation-delay:0s!important; }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:0s!important; animation-duration:0s!important; animation-delay:0s!important; } }
@media (max-height:544px) { #rotateNotice { display:flex; } }
@media (max-width:340px) { #hud { gap:4px; } #dots { gap:3px; } #soundChip { padding:0 8px; } #dayName { font-size:14px; } }
.music-acc { display:inline-block; white-space:nowrap; line-height:1; }

/* 사용자 화면은 세로로 읽고, 운행 화면은 기존의 고정 무대를 쓴다. */
.screen-panel{position:absolute;inset:6px 8px;z-index:20;background:var(--bg);overflow:auto;overscroll-behavior:contain;border-radius:18px;padding:18px 14px 24px;scrollbar-width:thin}
.screen-panel h1,.screen-panel h2,.screen-panel p{margin:0}
.screen-panel h1{font-size:25px;line-height:1.25;letter-spacing:-.04em}
.screen-panel h2{font-size:18px;line-height:1.4;letter-spacing:-.025em}
.screen-panel p{font-size:15px;line-height:1.7}
.screen-button{min-width:44px;min-height:46px;padding:10px 16px;border:1px solid #a5b7c3;border-radius:12px;background:#fff;font-size:14px;font-weight:700;display:inline-flex;justify-content:center;align-items:center;gap:6px;color:var(--ink);line-height:1.35;flex-shrink:0}
.screen-button.primary{background:var(--steel);border-color:var(--steel);color:#fff;min-height:52px;font-size:16px;box-shadow:0 4px 0 #104b62}
.screen-button.secondary{background:var(--steel-soft);border-color:var(--steel);color:var(--steel)}
.screen-button.selected,.screen-button[aria-pressed=true]{background:var(--steel-soft);border-color:var(--steel);box-shadow:inset 0 0 0 1px var(--steel)}
.screen-button:disabled{background:#e1e7eb;color:#596975;cursor:default;box-shadow:none}
.screen-heading{display:flex;align-items:flex-start;gap:14px;margin-bottom:22px;min-height:46px}
.screen-heading>div{flex:1;padding-top:2px}
.screen-heading p{font-size:13px;color:var(--ink-2);margin-top:6px}
.back-button{min-height:44px;padding:8px 12px;border-color:transparent;background:transparent;color:var(--steel)}
.screen-footer{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.screen-footer>.screen-button{flex:1}
.title-screen{min-height:100%;display:flex;flex-direction:column;max-width:540px;margin:auto;position:relative;padding:8px 10px 4px}
.title-brand{display:flex;gap:10px;align-items:center;margin-bottom:24px}
.title-brand p{font-size:12px;letter-spacing:.04em;color:var(--steel);font-weight:700}
.brand-mark{display:flex;gap:3px;align-items:end;height:22px}
.brand-mark i{display:block;width:7px;background:var(--steel);border-radius:2px}
.brand-mark i:nth-child(1){height:9px}.brand-mark i:nth-child(2){height:15px}.brand-mark i:nth-child(3){height:21px}
.title-screen h1{font-size:clamp(40px,8.8vw,64px);line-height:1.05;letter-spacing:-.065em;color:#173746;z-index:1}
.title-lead{font-size:17px!important;line-height:1.55!important;color:var(--ink-2);margin-top:18px!important;z-index:1}
.station-art{display:block;width:100%;margin:-12px 0 -3px;min-height:170px;flex:1;max-height:330px}
.title-actions{display:flex;flex-direction:column;gap:13px;z-index:1}
.title-links{display:flex;gap:8px;margin-top:2px}.title-links>.screen-button{flex:1;padding-left:6px;padding-right:6px;background:transparent;border-color:transparent;color:var(--steel)}
.map-list{display:flex;flex-direction:column;gap:10px;position:relative}
.day-stop{position:relative;display:flex;align-items:center;gap:14px;min-height:84px;width:100%;padding:12px;background:#fff;border:1px solid var(--line);border-radius:15px;text-align:left;z-index:1;box-shadow:0 2px 0 #d7e0e6}
.day-number{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;border-radius:13px;background:var(--steel-soft);color:var(--steel);font-size:16px;font-weight:800}
.day-copy{flex:1;display:flex;flex-direction:column;gap:5px}.day-copy strong{font-size:15px}.day-copy>span{font-size:12px;color:var(--ink-2);line-height:1.5}
.day-stamp{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--steel);min-width:39px;text-align:center}
.day-stop.passed .day-stamp{color:var(--good);border:2px solid var(--good);width:45px;height:45px;border-radius:50%;transform:rotate(-8deg);line-height:1.15}
.day-stop:disabled{background:#e1e7eb;color:#596975;box-shadow:none}.day-stop:disabled .day-number{background:#d2dce3;color:#596975}.day-stop:disabled .day-stamp{color:#596975}
.closing-summary{display:flex;gap:26px;align-items:center;padding:22px;background:white;border:1px solid var(--line);border-radius:18px;margin-bottom:18px}
.closing-summary>div{flex:1}.closing-summary p{font-size:13px!important;color:var(--ink-2)}.closing-summary strong{font-size:45px;letter-spacing:-.06em;line-height:1.5}.closing-summary strong small{font-size:22px;color:var(--ink-2);font-weight:500}
.stamp-art{width:95px;height:95px;border:4px double var(--good);border-radius:50%;font-size:21px;line-height:1.15;font-weight:800;color:var(--good);display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);text-align:center;flex-shrink:0}
.stamp-art.pending{color:var(--steel);border-color:var(--steel)}
.result-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px}.result-list li{display:flex;align-items:center;gap:12px;min-height:40px;padding:5px 13px;border-bottom:1px solid #d6e0e7;font-size:14px}.result-dot{font-size:19px;color:var(--steel)}
.new-cards{margin-top:20px;padding:16px;border-radius:12px;background:#fff3c4}.new-cards h2{font-size:15px}.new-cards p{margin-top:7px;font-size:14px}.test-caption{font-size:12px!important;color:var(--ink-2);text-align:center;margin-top:18px!important}
.discovery-visual{border:1px solid var(--line);background:#fff;border-radius:18px;overflow:hidden;padding:12px 0 16px}.mini-stage{display:block;width:100%;height:auto}.diagram-symbol{font-size:23px;font-weight:800;text-align:center;color:var(--steel);letter-spacing:-.03em}.discovery-text{font-size:18px!important;line-height:1.8!important;margin:24px 4px!important;letter-spacing:-.025em}
.scene-pages{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.scene-pages .screen-button{font-size:13px;padding:9px 12px;min-height:44px}
.book-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.book-card{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;min-height:144px;padding:16px;border:1px solid #a8bfce;border-radius:15px;background:#fff;text-align:left;box-shadow:0 3px 0 #cfdae2}
.book-card>span{font-size:12px;color:var(--steel);font-weight:700}.book-card strong{font-size:16px;line-height:1.45;margin:12px 0;letter-spacing:-.035em}.book-card small{font-size:12px;color:var(--ink-2)}.book-card.locked{background:#dfe6eb;border-color:#c7d2da;color:#596975;box-shadow:none}.book-card.locked>span{color:#596975}
.card-detail{padding:18px;border:2px solid var(--steel);background:white;border-radius:16px;margin-bottom:20px}.card-detail .eyebrow{font-size:12px;font-weight:700;color:var(--steel)}.card-detail h2{margin:8px 0 0!important}.card-detail p{margin:10px 0 18px!important}.card-detail .mini-stage{margin:14px 0}
.sub-heading{margin:26px 0 13px!important}.scene-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.scene-list .screen-button{padding:10px 7px}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.stat-grid>div{display:flex;flex-direction:column;gap:10px;padding:19px 8px;text-align:center;border:1px solid var(--line);background:white;border-radius:14px}.stat-grid strong{font-size:30px;color:var(--steel)}.stat-grid span{font-size:12px;color:var(--ink-2)}

<script>

// SOURCE theory.js
// ═══ 1 THEORY ═══ 이론 엔진. 표를 두지 않고 공식 둘(장음계, 3도 쌓기)에서 만든다. 화면과 소리를 부르지 않는다
const MAJOR = [2, 2, 1, 2, 2, 2, 1];                                              // 장음계 공식: 온 온 반 온 온 온 반
const LETTERS = "CDEFGAB";
const NAT = MAJOR.slice(0, -1).reduce((a, s) => a.concat(a[a.length - 1] + s), [0]);   // 자연음의 반음값 = 공식의 누적합
const OCT = MAJOR.reduce((a, b) => a + b, 0), STEPS = MAJOR.length;               // 한 옥타브 = 반음 12개 = 글자(오선 자리) 7개
const M3 = NAT[2] - NAT[0], m3 = NAT[4] - NAT[2];                                 // 장3도(C–E), 단3도(E–G)
const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);                         // 주파수 공식. 이것만 쓴다
const ACC = { bb: -2, b: -1, "": 0, "#": 1, x: 2 };
const ACC_TXT = ["𝄫", "♭", "", "♯", "𝄪"], ACC_KO = ["더블플랫", "플랫", "", "샵", "더블샵"];
const QUAL = {                                                                    // 3도 쌓기 공식(아래에서 위로). M 장3도, m 단3도
  "": { stack: "Mm", ko: "장3화음" }, m: { stack: "mM", ko: "단3화음" },
  dim: { stack: "mm", ko: "감3화음" }, aug: { stack: "MM", ko: "증3화음" },
  M7: { stack: "MmM", ko: "장7화음" }, 7: { stack: "Mmm", ko: "딸림7화음" }, m7: { stack: "mMm", ko: "단7화음" },
  m7b5: { stack: "mmM", ko: "반감7화음" }, dim7: { stack: "mmm", ko: "감7화음" },
};
const INV_KO = ["기본 위치", "첫째 자리바꿈", "둘째 자리바꿈", "셋째 자리바꿈"];     // 밑음이 근음 · 3음 · 5음 · 7음일 때
const INV_HAN = ["기본위치", "제1전위", "제2전위", "제3전위"];                       // 같은 것의 한자말(교재 표기)
const degKo = (k) => (k ? 2 * k + 1 + "음" : "근음");                              // 구성음의 이름: 근음, 3음, 5음, 7음

// 음: { l 글자(0~6), a 기호(−2~2), o 옥타브 }. 글자와 기호를 따로 둔다. E♯을 F로 바꾸지 않는다
const pc = (s) => { const m = /^([A-G])(bb|b|x|#)?$/.exec(s); return m ? { l: LETTERS.indexOf(m[1]), a: ACC[m[2] || ""] } : null; };
const note = (s) => { const m = /^([A-G](?:bb|b|x|#)?)(\d)$/.exec(s), p = m && pc(m[1]); return p ? { l: p.l, a: p.a, o: +m[2] } : null; };
const midi = (n) => OCT * (n.o + 1) + NAT[n.l] + n.a;                             // 건반 번호
const pos = (n) => STEPS * n.o + n.l;                                             // 오선 자리. 기호는 자리를 바꾸지 않는다
const pcName = (p) => LETTERS[p.l] + ACC_TXT[p.a + 2];                            // 화면에 적는 이름
const pcAscii = (p) => LETTERS[p.l] + Object.keys(ACC).find((key) => ACC[key] === p.a);
const pcSay = (p) => LETTERS[p.l] + (p.a ? " " + ACC_KO[p.a + 2] : "");            // 화면 읽기에 주는 이름

// 화음: 이름에서 구성음을 만든다. 근음에서 한 글자씩 건너며 공식의 3도를 쌓는다
function chord(id) {
  const m = /^([A-G](?:bb|b|x|#)?)(.*)$/.exec(id), q = m && QUAL[m[2]];
  if (!q) return null;
  const root = pc(m[1]), tones = [root];
  let semi = NAT[root.l] + root.a;
  for (let k = 1; k <= q.stack.length; k++) {
    semi += q.stack[k - 1] === "M" ? M3 : m3;
    const l = (root.l + 2 * k) % STEPS;                                           // 3도 위의 글자: 한 글자를 건넌다
    tones.push({ l, a: ((((semi - NAT[l]) % OCT) + OCT + 6) % OCT) - 6 });         // 그 글자에 붙는 기호
  }
  return { id, sym: pcName(root) + m[2].replace("b5", "(♭5)"), ko: q.ko, root, tones, n: tones.length };
}

// 배치: 구성음마다 { k 몇째 구성음, o 옥타브 }. v1.0의 배치는 구성음이 하나씩이고 k 순서로 둔다
const noteAt = (ch, x) => ({ l: ch.tones[x.k].l, a: ch.tones[x.k].a, o: x.o });
const midiAt = (ch, x) => midi(noteAt(ch, x));
const posAt = (ch, x) => pos(noteAt(ch, x));
const voicing = (ch, s) => s.split(" ").map((t) => { const n = note(t); return { k: n ? ch.tones.findIndex((c) => c.l === n.l && c.a === n.a) : -1, o: n ? n.o : 0 }; });
const byMember = (v) => v.slice().sort((x, y) => x.k - y.k);
const isPlain = (ch, v) => v.length === ch.n && byMember(v).every((x, i) => x.k === i);   // 구성음이 빠짐없이 하나씩
const order = (ch, v) => v.map((_, i) => i).sort((i, j) => midiAt(ch, v[i]) - midiAt(ch, v[j]));   // 낮은 순서로 늘어놓은 색인
const bassIx = (ch, v) => order(ch, v)[0];                                        // 밑음 = 실제로 가장 낮은 음. 배열의 첫 원소가 아니다
const topIx = (ch, v) => order(ch, v)[v.length - 1];
const inversion = (ch, v) => v[bassIx(ch, v)].k;                                  // 자리바꿈 번호 = 밑음이 몇째 구성음인가
const move = (v, i, d) => v.map((x, j) => (j === i ? { k: x.k, o: x.o + d } : x));   // 한 음을 옥타브만 옮긴다. 글자와 기호는 그대로
const rideUp = (ch, v) => move(v, bassIx(ch, v), 1);                              // 올리기: 가장 낮은 음이 한 옥타브 위로
const rideDown = (ch, v) => move(v, topIx(ch, v), -1);                            // 내리기: 가장 높은 음이 한 옥타브 아래로
const span = (ch, v) => midiAt(ch, v[topIx(ch, v)]) - midiAt(ch, v[bassIx(ch, v)]);
const isClose = (ch, v) => span(ch, v) < OCT;                                     // 밀집 배치: 모든 음이 한 옥타브 안
const sameV = (a, b) => a.length === b.length && a.every((x) => b.some((y) => y.k === x.k && y.o === x.o));
const gaps = (ch, v) => { const o = order(ch, v); return o.slice(1).map((i, j) => posAt(ch, v[i]) - posAt(ch, v[o[j]]) + 1); };   // 이웃한 음 사이의 도수
const isStack = (ch, v) => gaps(ch, v).every((g) => g === 3);                     // 3도로만 쌓였는가
const FRAME = { lo: pos(note("C4")), hi: pos(note("C6")) };                       // 무대의 층: C4부터 C6까지 오선 자리 15개
const inFrame = (ch, v, f = FRAME) => v.every((x) => posAt(ch, x) >= f.lo && posAt(ch, x) <= f.hi);
function closeV(ch, inv, lo = FRAME.lo) {                                         // 밀집 배치: inv째 구성음을 lo 자리 이상에서 가장 낮게 놓고 구성 순서대로 쌓는다
  const v = [];
  let prev = null;
  for (let j = 0; j < ch.n; j++) {
    const k = (inv + j) % ch.n;
    let o = 0;
    while (prev === null ? posAt(ch, { k, o }) < lo : midiAt(ch, { k, o }) <= prev) o++;
    v.push({ k, o });
    prev = midiAt(ch, { k, o });
  }
  return byMember(v);
}
const vText = (ch, v, oct = true) => order(ch, v).map((i) => pcName(ch.tones[v[i].k]) + (oct ? v[i].o : "")).join(" ");   // 낮은 음부터 적는다
const vAscii = (ch, v) => order(ch, v).map((i) => pcAscii(ch.tones[v[i].k]) + v[i].o).join(" ");
const symOfInv = (ch, k) => ch.sym + (k ? "/" + pcName(ch.tones[k]) : "");        // 슬래시 왼쪽은 화음, 오른쪽은 밑음
const symbolOf = (ch, v) => symOfInv(ch, inversion(ch, v));
function slash(s) {                                                               // 심벌 읽기: 밑음이 근음인가, 다른 구성음인가(자리바꿈), 화음 밖의 음인가
  const [c, b] = s.split("/"), ch = chord(c), p = b === undefined ? null : pc(b);
  if (!ch || (b !== undefined && !p)) return null;
  const k = p ? ch.tones.findIndex((t) => t.l === p.l && t.a === p.a) : 0;
  return { ch, bass: p || ch.root, k, kind: k < 0 ? "outside" : k ? "inversion" : "root" };
}
function rootLetter(letters) {                                                    // 이름 없이 근음 찾기: 어느 글자에서 한 글자씩 건너 나머지에 모두 닿는가
  const set = [...new Set(letters)];
  return set.find((r) => set.every((l) => { const d = (l - r + STEPS) % STEPS; return d % 2 === 0 && d / 2 < set.length; }));
}
function reach(ch, v0, free, f = FRAME) {                                         // 허용된 조작으로 갈 수 있는 배치 전부와 최소 조작 수(너비 우선)
  const key = (v) => byMember(v).map((x) => x.k + "." + x.o).join(" "), seen = new Map([[key(v0), { v: v0, d: 0 }]]), q = [v0];
  while (q.length) {
    const v = q.shift(), d = seen.get(key(v)).d;
    const next = free ? v.flatMap((_, i) => [move(v, i, 1), move(v, i, -1)]) : [rideUp(ch, v), rideDown(ch, v)];
    for (const w of next) if (inFrame(ch, w, f) && !seen.has(key(w))) { seen.set(key(w), { v: w, d: d + 1 }); q.push(w); }
  }
  return [...seen.values()];
}


// SOURCE words.js
// 표시 낱말은 한 곳에서 바꾼다. 검사는 학습 설정을 저장하지 않고 격리한다.
let wordTestSettings = null;
function wordSettings() {
  return wordTestSettings || (typeof saveData !== "undefined" ? saveData.settings : { bassWord: "밑음", invWord: "자리바꿈" });
}
function withWords(settings, fn) {
  const previous = wordTestSettings;
  wordTestSettings = settings;
  try { return fn(); } finally { wordTestSettings = previous; }
}
const WORDS = {
  root: "근음", rootEn: "Root", bassEn: "Bass",
  get bass() { return wordSettings().bassWord || "밑음"; },
  get inv() { return INV_KO.map((text, k) => wordSettings().invWord === "전위" ? ["기본위치", "제1전위", "제2전위", "제3전위"][k] : text); },
  get invShort() { return wordSettings().invWord === "전위" ? ["기본위치", "제1전위", "제2전위", "제3전위"] : INV_SHORT; }
};
const invName = k => WORDS.inv[k];
const invShort = k => WORDS.invShort[k];
function translateWords(text) {
  let result = String(text);
  if (wordSettings().bassWord === "베이스") {
    result = result.replaceAll("밑음은", "베이스는").replaceAll("밑음이", "베이스가")
      .replaceAll("밑음을", "베이스를").replaceAll("밑음과", "베이스와")
      .replaceAll("밑음으로", "베이스로").replaceAll("밑음이에요", "베이스예요")
      .replaceAll("밑음", "베이스");
  }
  if (wordSettings().invWord === "전위") {
    for (const [oldWord, newWord] of [["첫째 자리바꿈", "제1전위"], ["둘째 자리바꿈", "제2전위"], ["셋째 자리바꿈", "제3전위"]]) {
      result = result.replaceAll(oldWord + "이에요", newWord + "예요")
        .replaceAll(oldWord + "은", newWord + "는").replaceAll(oldWord + "이", newWord + "가")
        .replaceAll(oldWord + "을", newWord + "를").replaceAll(oldWord, newWord);
    }
    result = result.replaceAll("기본 위치", "기본위치").replaceAll("자리바꿈", "전위");
  }
  return result;
}


// SOURCE flow.js

  const store = createSaveStore(adapter), sample = store.defaults();
  sample.settings.volume = 0.43;

  sample.cards = ["root", "inv1"]; sample.scenes = ["S2"]; sample.causes = { top: 5, bass: 2 };
  sample.stats = { jobs: 7, full: 6, pads: 4 };
  sample.active = { day: "d1", idx: 4, results: ["full","half","full","full"], phase: "review", review: [1,3], reviewPos: 1, newCards: ["inv1"] };
  if (mode === "corrupt") {
    return ["{broken", JSON.stringify({version:2}), JSON.stringify({version:1,cards:5})].every(text => {
      records.set(SAVE_KEY,text); const fresh=createSaveStore(adapter), value=fresh.load();
      return value.version===1 && value.active===null && records.get(SAVE_KEY+"_backup")===text;
    });

    unavailable.load(); unavailable.save(sample);
    const writeBlocked=createSaveStore({getItem(){return null;},setItem(){throw new Error("blocked");}});

  }
  store.save(sample); const result=createSaveStore(adapter).load();

  records.set(SAVE_KEY,JSON.stringify({version:1,days:sample.days}));

function collectProductTexts() {
  const texts = new Set(), wrong = [], keep = t => { if (t) texts.add(t); };
  const ap=(s,p)=>Object.assign({},s,p||{});
  for (const d of DAYS.concat([SPIKE])) for(const j of d.jobs) {
    const m=build(j,d); let s=F.start(m); keep(m.text); keep(s.msg.text);
    for(let guard=0; guard<8 && m.steps[s.step].kind!=="listen";guard++) {
      const st=m.steps[s.step];

      if(st.kind==="pick") {
        const answer=st.want==="root"?0:inversion(m.ch,s.v);
        m.ch.tones.forEach((_,k)=>{if(k!==answer)chk(ap(s,{sel:k}));});

        for(const x of reach(m.ch,s.v,m.free)) {const t=ap(s,{v:x.v,moved:x.d});if(!right(m,t))chk(t);keep(prompt(m,s.step,x.v));}
        s=ap(s,{v:fixV(m,s)});
      } else {st.choices.forEach((_,i)=>{if(i!==st.answer)chk(ap(s,{choice:i}));});s=ap(s,{choice:st.answer});}
      s=ap(s,F.confirm(m,s));keep(s.msg.text);
    }
  }
  ["먼저 음을 골라 주세요.", "먼저 보기를 골라 주세요.", "더 올라갈 층이 없어요. 내리기를 써 보세요.", "더 내려갈 층이 없어요. 올리기를 써 보세요.", "소리가 멈췄어요. 소리 켜기를 누르고 다시 들어 보세요."].forEach(keep);

}

    for(const [width,height] of sizes) {
      frame.style.width=width+"px";frame.style.height=height+"px";await pause(90);
      for(const day of api.DAYS)for(let index=0;index<day.jobs.length;index++) {
        let errors=[];
        try {api.openJob(day,index,[]);errors=inspectLayout(width,height);}
        catch(error){errors=[error.message];}
        const row={id:day.jobs[index].id,width,height,pass:errors.length===0,errors};
        report.layouts.push(row);if(errors.length)report.failures.push({section:"layout",...row});
      }
      update("화면 조합 "+report.layouts.length+"/504 확인 중");
    }
    frame.style.width="390px";frame.style.height="844px";await pause(90);
    win.location.hash="";
    const titleDeadline=Date.now()+5000;
    while(api.App.screen!=="title"&&Date.now()<titleDeadline)await pause(16);
    require(api.App.screen==="title","타이틀 진입 실패");
    press('[data-action="nav"][data-screen="map"]');
    for(const day of api.DAYS) {
      press('[data-action="day"][data-day="'+day.id+'"]');
      for(let guard=0;guard<40 && api.App.screen!=="close";guard++) {
        if(api.App.screen==="scene") {press('[data-action="scene-next"]');continue;}
        const soundNo=doc.querySelector('[data-sound-check="no"]');if(soundNo&&soundNo.getBoundingClientRect().width>0){press('[data-sound-check="no"]');continue;}
        require(api.App.screen==="run","진도 화면 중단 "+api.App.screen);
        const id=api.App.m.id;solveCurrent(false);press("#btnOk");
        report.progression.push({id,pass:true});
      }
      require(api.App.screen==="close","마감 실패 "+day.id);
      require(api.saveData.days[day.id]?.passed,"운행일 통과 기록 실패 "+day.id);
      require(api.saveData.days[day.id].best===day.jobs.length,"최고 기록 실패 "+day.id);
      press('[data-action="nav"][data-screen="map"]');
    }
    require(report.progression.length===63,"정규 진도 합계가 달라요");
    require(api.saveData.stats.pads===0,"패드 없이 완주 기록이 달라요");
    press('[data-action="nav"][data-screen="title"]');
    const storedBefore=JSON.stringify(api.saveData);
    press('[data-action="lab"]');press("#btnUp");press("#homeBtn");
    require(JSON.stringify(api.saveData)===storedBefore,"실험실에서 기록이 바뀌었어요");
    report.lab={pass:true,recordUnchanged:true};
    report.errors=win.__auditErrors.slice();
    if(report.errors.length)report.failures.push({section:"console",errors:report.errors});
  } catch(error) {report.failures.push({section:"driver",error:error.message});}
  finally {
    if(frame)frame.remove();
    report.finished=new Date().toISOString();
    report.pass=report.failures.length===0&&report.paths.length===126&&report.layouts.length===504&&report.progression.length===63;
    window.__uiAuditReport=report;
    update(JSON.stringify(report,null,2));
    if(button)button.disabled=false;
    uiAuditRunning=false;
  }
  return report;
}

// ═══ 11 BOOT ═══ 제품 진입점 and development hashes.
function boot() {
  const hash = location.hash.slice(1);
  const match = /^(d[0-7]|sp)(?:-(\d+))?$/.exec(hash);
  if (match) {
    const day = match[1] === "sp" ? SPIKE : DAYS.find(d => d.id === match[1]);
    const index = Math.min(day.jobs.length, Math.max(1, +(match[2] || 1))) - 1;
    setState({ debug: true, closeData: null });
    openJob(day, index, [], freshSession());
  } else if (hash === "test") goScreen("test");
  else if (hash === "lab") enterLab();
  else goScreen("title");
}
setupInput();
setupScreenInputs();
const firstModel = build(DAYS[0].jobs[0], DAYS[0]);
setState({ m: firstModel, s: F.start(firstModel) });
window.__tests = selfTest();
boot();
window.addEventListener("hashchange", boot);
window.__spike = {
  App, F, build, show, setState, openJob, layout: () => G, DAYS, SPIKE,
  Store, startDay, resumeDay, nextJob, goScreen, enterLab, currentView,
  get saveData() { return saveData; }
};
window.addEventListener("error", event => {
  console.error(event.message);
  if ($("screenPanel")) {
    stopRun(false);
    $("screenPanel").hidden = false;
    $("screenPanel").innerHTML = '<h1>문제가 생겼어요</h1><p>다시 열어 이어서 해 보세요.</p><button type="button" onclick="location.reload()">새로고침</button>';
  }
}, { once: true });
